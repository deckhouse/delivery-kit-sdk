version: "3"

vars:
  package: "github.com/deckhouse/delivery-kit-sdk"

tasks:
  build:
    cmds:
      - go build {{.CLI_ARGS}} ./...
    env:
      CGO_ENABLED: "0"

  lint:
    desc: 'Run all linters in parallel. Important vars: "paths".'
    deps:
      - lint:golangci-lint

  lint:golangci-lint:
    desc: 'Lint with golangci-lint. Important vars: "paths".'
    cmds:
      - golangci-lint run {{.CLI_ARGS}} {{.paths | default "./..."}}

  format:
    desc: 'Run all code formatters. Important vars: "paths".'
    run: once
    cmds:
      - task: format:gci
      - task: format:gofumpt

  format:gci:
    desc: 'Format code with gci. Important vars: "paths".'
    cmds:
      - gci write -s Standard -s Default -s 'Prefix({{.package}})' {{.paths | default "pkg/ test/ internal/"}}

  format:gofumpt:
    desc: 'Format code with gofumpt. Important vars: "paths".'
    cmds:
      - gofumpt -extra -w {{.CLI_ARGS}} {{.paths | default "pkg/ test/ internal/"}}

  test:ginkgo:
    desc: 'Run raw "ginkgo". Important vars: "paths".'
    vars:
      parallel: '{{.parallel | default "true"}}'
      paths: '{{.paths | default "./pkg/... ./internal/..." }}'
      labelFilter: '{{.labelFilter | default ""}}'
    cmds:
      - ginkgo {{if eq .parallel "true" }}-p{{end}} {{if .labelFilter}}--label-filter="{{.labelFilter}}"{{end}} -r -race {{.CLI_ARGS}} {{.paths}}

  test:unit:
    desc: "Run all unit tests."
    cmds:
      - task: test:ginkgo
        vars:
          labelFilter: "!e2e"

  test:e2e:
    desc: "Run e2e tests."
    cmds:
      - task: test:ginkgo
        vars:
          labelFilter: '{{.labelFilter | default "e2e && !elf-legacy"}}'

  deps:install:
    desc: "Install all dependencies"
    deps:
      - deps:install:gci
      - deps:install:ginkgo
      - deps:install:golangci-lint
      - deps:install:gofumpt

  deps:install:gci:
    desc: "Install gci binary."
    cmds:
      - go install github.com/daixiang0/gci@v0.13.5

  deps:install:ginkgo:
    desc: "Install ginkgo binary."
    cmds:
      - |
        version="$(go list -m -f '{{ printf `{{ .Version }}` }}' github.com/onsi/ginkgo/v2)"
        go install {{.CLI_ARGS}} github.com/onsi/ginkgo/v2/ginkgo@${version}

  deps:install:golangci-lint:
    desc: "Install golangci-lint binary."
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin {{.golangcilintVersion | default "v2.4.0"}}

  deps:install:gofumpt:
    desc: "Install gofumpt binary."
    cmds:
      - go install mvdan.cc/gofumpt@v0.7.0

  generate:
    desc: "Run all generators."
    deps:
      - go:generate

  go:generate:
    desc: "Run go-generate."
    cmds:
      - go generate ./...

  test:elf-legacy:
    desc: "Check interoperability with the former libelf/objcopy implementation (Linux)."
    vars:
      legacyDir: pkg/signature/elf/inhouse/testdata/legacy
      legacyTool: '{{.legacyTool | default "/tmp/delivery-kit-elf-legacy"}}'
    cmds:
      - cc -I{{.legacyDir}} {{.legacyDir}}/*.c -lelf -lcrypto -o {{.legacyTool}}
      - task test:e2e paths=./pkg/signature/elf/inhouse labelFilter=elf-legacy parallel=false {{if .CLI_ARGS}}-- {{.CLI_ARGS}}{{end}}
    env:
      ELF_LEGACY_TOOL: '{{.legacyTool}}'
